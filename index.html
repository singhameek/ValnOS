<!DOCTYPE html>
<html style="background-color: black; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">



    <body style="background-image: url(wp.jpg); background-size: cover; height: 100vh;">
        
        <!--welcome window-->
        <div id="welcome" class="window" style="display: block;">
            <p id="welcomeheader" class="windowheader">[====]</p>
            <h1 style="text-align: center;" class="text">Welcome to ValnOS!</h1>
            <p style= "text-align: center;" class="text">This is my WebOS<br>Use the Header([===]) to drag the window, and press X to close it<br>Have fun and look around!</p>
            <p id="welcomeclose" class="closebutton">X</p>
        </div>    


        <!--top bar-->
        <div
        style="display: flex; justify-content: space-between; position: absolute; width: 100%; backdrop-filter: blur(10px); background-color: rgba(0,0,0, 0.25); color: antiquewhite" id="top">
            <p style=" margin-left: 16px; cursor: pointer;" id="welcomeopen">ValnOS</p>
            <p style=" margin-right: 16px;" id="clock">Loading time...</p>
            <p style="margin-right: 16px;" id="date">date</p>
        </div>

        <!--apps-->
        <div id="desktopApps" style="padding-top: 96px; padding-left: 16px;">
            <div style="text-align: center; padding: 8px; width: fit-content" id="browserIcon">
                <img src="browser.png" style="width: 64px; height:64px; border-radius: 48px">
                <p class="text">Web Browser</p>
            </div>    
            <div style="text-align: center; padding: 8px; width: fit-content" id="calcIcon">
                <img src="calc.png" style="width: 64px; height:64px; border-radius: 48px">
                <p class="text">Calculator</p>
            </div>
            <div style="text-align: center; padding: 8px; width: fit-content" id="notesIcon">
                <img src="notes.png" style="width: 64px; height:64px; border-radius: 48px">
                <p class="text">Notes</p>
            </div>    
        </div>
        <!--Browser-->
        <div id="browser" class="window" style="width:120px">
            <p id="browserheader" class="windowheader">[====]</p>
            <p style="color: rgba 0,0,0,1;">e<br>e</p>
            <a class="text" href="https://google.com" style="position: absolute; top: 50px"> Open Search </a>
            <p id="browserClose" class="closebutton">X</p>
        </div> 

        <!--Calculator-->
        <div id="calc" class="window" style="width: 220px; display:none;">
    <p id="calcheader" class="windowheader">[====]</p>
    <input type="text" id="calcDisplay" readonly
        style="width: 100%; box-sizing: border-box; text-align: right; font-size: 20px; padding: 8px; margin-bottom: 8px; border-radius: 8px; border: none;">

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;">
        <button class="calcBtn" onclick="calcClear()">C</button>
        <button class="calcBtn" onclick="calcInput('/')">÷</button>
        <button class="calcBtn" onclick="calcInput('*')">×</button>
        <button class="calcBtn" onclick="calcBackspace()">⌫</button>

        <button class="calcBtn" onclick="calcInput('7')">7</button>
        <button class="calcBtn" onclick="calcInput('8')">8</button>
        <button class="calcBtn" onclick="calcInput('9')">9</button>
        <button class="calcBtn" onclick="calcInput('-')">−</button>

        <button class="calcBtn" onclick="calcInput('4')">4</button>
        <button class="calcBtn" onclick="calcInput('5')">5</button>
        <button class="calcBtn" onclick="calcInput('6')">6</button>
        <button class="calcBtn" onclick="calcInput('+')">+</button>

        <button class="calcBtn" onclick="calcInput('1')">1</button>
        <button class="calcBtn" onclick="calcInput('2')">2</button>
        <button class="calcBtn" onclick="calcInput('3')">3</button>
        <button class="calcBtn" onclick="calcEquals()" style="grid-row: span 2;">=</button>

        <button class="calcBtn" onclick="calcInput('0')" style="grid-column: span 2;">0</button>
        <button class="calcBtn" onclick="calcInput('.')">.</button>
    </div>

    <p id="calcClose" class="closebutton">X</p>
</div>

    <!--Notes-->
<div id="notes" class="window" style="width:220px; display:none;">
    <p id="notesheader" class="windowheader">[====]</p>
    <textarea id="notesArea" placeholder="Type your notes here..."
        style="width: 100%; box-sizing: border-box; height: 150px; resize: none; border-radius: 8px; border: none; padding: 8px; font-family: inherit; background-color: rgba(255,255,255,0.9);"></textarea>
    <p id="notesClose" class="closebutton">X</p>
</div>

        <script src="script.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css" />
    </body>



</html>
