<!DOCTYPE html>
<html style="background-color: black; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;">



    <body style="background-image: url(wp.jpg); background-size: cover; height: 100vh;">
        
        <!--welcome window-->
        <div id="welcome" class="window" style="display: block;">
            <p id="welcomeheader" class="windowheader">[====]</p>
            <h1 style="text-align: center;" class="text">Welcome to ValnOS!</h1>
            <p style= "text-align: center;" class="text">This is my WebOS<br>Use the Header([===]) to drag the window, and press X to close it<br>Have fun and look around!</p>
            <p id="welcomeclose" class="closebutton">X</p>
        </div>    


        <!--top bar-->
        <div
        style="display: flex; justify-content: space-between; position: absolute; width: 100%; backdrop-filter: blur(10px); background-color: rgba(0,0,0, 0.25); color: antiquewhite">
            <p style=" margin-left: 16px; cursor: pointer;" id="welcomeopen">ValnOS</p>
            <p style=" margin-right: 16px;" id="clock">Loading time...</p>
            <p style="margin-right: 16px;" id="date">date</p>
        </div>

        <!--apps-->
        <div id="desktopApps" style="padding-top: 96px; padding-left: 16px;">
            <div style="text-align: center; padding: 8px; width: fit-content" id="browserIcon" onclick="handleIconTap(this, browserScreen)">
                <img src="browser.png" style="width: 64px; height:64px; border-radius: 48px">
                <p class="text">Web Browser</p>
            </div>    
        </div>

        <div id="browser" class="window">
            <p id="browserClose" class="closebutton">X</p>
            <p id="browserheader" class="windowheader">[====]</p>
            <a class="text" href="https://google.com"> Open Search </a>
        </div> 

        <script src="script.js"></script>
        <link rel="stylesheet" type="text/css" href="style.css" />
    </body>



</html>
